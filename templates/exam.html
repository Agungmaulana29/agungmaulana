<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Exam</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

body{
    background:#f4f6f9;
}

.card{
    border-radius:15px;
}

.timer{
    font-size:30px;
    font-weight:bold;
    color:red;
}

.badge-status{
    font-size:16px;
}

.question{
    margin-top:25px;
    margin-bottom:25px;
}

</style>

</head>


<body>


<div class="container mt-4">


<div class="card shadow">


<div class="card-body">


<div class="row">


<div class="col-md-8">


<h2>
📝 Smart Online Exam
</h2>


<p>

<b>Nama :</b> {{name}}

<br>

<b>NIM :</b> {{nim}}

</p>


</div>


<div class="col-md-4 text-end">


<div class="timer" id="timer">

05:00

</div>


</div>


</div>


<hr>



<div class="row">


<div class="col-md-4">


<span class="badge bg-danger badge-status">

Warning :

<span id="warning">

{{warning}}

</span>

</span>


</div>



<div class="col-md-4">


<span class="badge bg-warning text-dark badge-status">


AFK :

<span id="afk">

{{afk}}

</span>


</span>


</div>



<div class="col-md-4">


<span
id="status"
class="badge bg-success badge-status">

ACTIVE

</span>


</div>


</div>



<hr>




<form

id="examForm"

action="/submit"

method="POST">


{% for q in questions %}


<div class="question">


<h5>

{{q.id}}.

{{q.question}}

</h5>



{% for option in q.options %}


<div class="form-check">


<input

class="form-check-input"

type="radio"

name="q{{q.id}}"

value="{{option}}"

required>


<label class="form-check-label">

{{option}}

</label>


</div>


{% endfor %}


</div>


{% endfor %}




<button

type="submit"

class="btn btn-primary btn-lg">

Submit Ujian

</button>


</form>



</div>


</div>


</div>




<script>


// =================================
// TIMER
// =================================


let duration = 300;


// tanda ujian selesai

window.examFinished = false;



function updateTimer(){


let minute = Math.floor(duration / 60);


let second = duration % 60;



document.getElementById("timer").innerHTML =

String(minute).padStart(2,"0")

+

":"

+

String(second).padStart(2,"0");



if(duration <= 0){


window.examFinished = true;


document.getElementById("examForm").submit();


}



duration--;


}



setInterval(updateTimer,1000);



// =================================
// STOP DETECTOR SAAT SUBMIT
// =================================


document.getElementById("examForm")
.addEventListener("submit",function(){


window.examFinished = true;


});



</script>



<script src="{{ url_for('static', filename='js/detector.js') }}"></script>


</body>


</html>
