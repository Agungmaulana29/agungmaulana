<!DOCTYPE html>
<html lang="en">

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:Arial, Helvetica, sans-serif;

        }

        .card{

            width:500px;

            border:none;

            border-radius:20px;

            padding:35px;

            box-shadow:0 10px 30px rgba(0,0,0,.3);

            text-align:center;

        }

        h1{

            color:#4e54c8;

            font-weight:bold;

            margin-bottom:10px;

        }

        p{

            color:gray;

            margin-bottom:30px;

        }

        .btn{

            width:100%;

            height:50px;

            font-size:18px;

            border-radius:10px;

            margin-top:15px;

        }

    </style>

</head>

<body>

<div class="card">

    <h1>📝 Smart Online Exam</h1>

    <p>

        Context-Aware Exam Platform<br>

        Pervasive Computing Project

    </p>

    <a href="/login" class="btn btn-primary">

        🔐 Masuk

    </a>

    <a href="/register" class="btn btn-success">

        📝 Daftar

    </a>

</div>

</body>

</html>
