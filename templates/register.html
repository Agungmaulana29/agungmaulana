<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar Akun</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{

            background: linear-gradient(135deg,#4e54c8,#8f94fb);

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:Arial, Helvetica, sans-serif;

        }

        .card{

            width:500px;

            border:none;

            border-radius:20px;

            padding:30px;

            box-shadow:0 10px 30px rgba(0,0,0,.3);

        }

        h2{

            text-align:center;

            color:#4e54c8;

            font-weight:bold;

            margin-bottom:20px;

        }

        .btn{

            width:100%;

            height:50px;

            border-radius:10px;

            margin-top:10px;

        }

    </style>

</head>

<body>

<div class="card">

<h2>📝 Daftar Akun</h2>

<form action="/register" method="POST" onsubmit="return validateForm()">

<div class="mb-3">

<label class="form-label">

Nama

</label>

<input
type="text"
class="form-control"
name="name"
required>

</div>

<div class="mb-3">

<label class="form-label">

NIM

</label>

<input
type="text"
class="form-control"
name="nim"
id="nim"
maxlength="15"
inputmode="numeric"
pattern="[0-9]+"
required>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
class="form-control"
name="password"
id="password"
required>

</div>

<div class="mb-4">

<label class="form-label">

Konfirmasi Password

</label>

<input
type="password"
class="form-control"
id="confirm_password"
required>

</div>

<button
type="submit"
class="btn btn-success">

📝 Daftar

</button>

<a
href="/login"
class="btn btn-primary">

🔐 Sudah punya akun? Masuk

</a>

</form>

</div>

<script>

// NIM hanya angka
document.getElementById("nim").addEventListener("input",function(){

    this.value=this.value.replace(/[^0-9]/g,'');

});

// Validasi password
function validateForm(){

    let pass=document.getElementById("password").value;

    let confirm=document.getElementById("confirm_password").value;

    if(pass!==confirm){

        alert("Password dan Konfirmasi Password tidak sama!");

        return false;

    }

    return true;

}

</script>

</body>

</html>
